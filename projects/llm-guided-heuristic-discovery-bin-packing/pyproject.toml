[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-guided-binpack"
version = "0.2.0"
description = "LLM-guided program search for interpretable online bin-packing heuristics"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "JORS Academy" }]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.66,<3"]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
llm-binpack = "llm_binpack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
