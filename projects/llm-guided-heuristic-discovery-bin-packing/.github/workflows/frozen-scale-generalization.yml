name: Frozen Scale Generalization

on:
  push:
    paths:
      - "scripts/frozen_scale_generalization.py"
      - ".github/workflows/frozen-scale-generalization.yml"

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Evaluate frozen heuristic on binpack2-4
        run: python scripts/frozen_scale_generalization.py
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-scale-generalization
          path: results/frozen_scale_generalization.json
