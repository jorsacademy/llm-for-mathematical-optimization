name: Research source normalization
on:
  push:
    branches: ['research/or-ai-extensions-20261001']
    paths: ['.github/workflows/or-ai-format-once.yml']
permissions:
  contents: write
jobs:
  normalize:
    if: github.repository_owner == 'jorsacademy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/or-ai-extensions-20261001
      - uses: actions/checkout@v4
        with:
          repository: jorsacademy/computational-optimization-methods
          ref: 64bc509ade68677ec452e32bf6b64259604c739a
          path: .normalization_source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation tools
        run: |
          python -m pip install ruff PyYAML numpy scipy scikit-learn
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run pinned research-only normalization and tests
        run: |
          python - <<'PY'
          import pathlib, subprocess, yaml
          path = pathlib.Path('.normalization_source/.github/workflows/or-ai-format-once.yml')
          workflow = yaml.safe_load(path.read_text())
          steps = workflow['jobs']['normalize']['steps']
          script = next(s['run'] for s in steps if s.get('name') == 'Format, lint and revalidate bounded additions')
          subprocess.run(['bash', '-e', '-c', script], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: validated-research-sources
          path: validated-research-sources.zip
