name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy --python-version "${{ matrix.python-version }}" src

      - name: Test with branch coverage
        run: pytest --cov=autoformulation --cov-report=term-missing

  heuristic-design:
    name: Heuristic design / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: projects/llm-guided-heuristic-discovery-bin-packing

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/llm-guided-heuristic-discovery-bin-packing/pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Lint
        run: ruff check src tests

      - name: Check formatting
        run: ruff format --check src tests

      - name: Test methodology and sandbox behavior
        run: pytest -q

      - name: Deterministic end-to-end discovery smoke
        if: matrix.python-version == '3.12'
        run: |
          llm-binpack discover \
            --provider deterministic \
            --generations 1 \
            --population 6 \
            --proposals 4 \
            --instances 1 \
            --items 30 \
            --validation-instances 1 \
            --validation-items 30 \
            --holdout-instances 1 \
            --holdout-items 50 \
            --candidate-timeout 5 \
            --output artifacts/ci-smoke.json

      - name: Validate discovery smoke artifact
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("artifacts/ci-smoke.json").read_text())
          assert payload["provider"] == "deterministic"
          assert payload["selected_expression"]
          assert payload["validation_selected"]["expression"] == payload["selected_expression"]
          assert payload["final_holdout"]["expression"] == payload["selected_expression"]
          budget = payload["search_budget"]
          assert budget["candidate_evaluations"] > 0
          assert budget["primary_proposer_usage"]["calls"] == 1
          print("heuristic-design smoke artifact valid")
          PY
